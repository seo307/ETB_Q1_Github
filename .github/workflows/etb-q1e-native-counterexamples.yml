name: ETB Q1E Native Counterexamples (source-scoped, NO Q1 promotion)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  q1e-counterexamples:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout research code without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Qualify frozen cases, source files, and original Q1E core tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool protocol/native_execution_plan_v095.json >/dev/null
          echo '5a3e8481425e5722a0e85ae0be39f9646a7c386d797682b4de21aa7eb9f5c87a  protocol/native_execution_plan_v095.json' | sha256sum -c -
          python3 -m unittest discover -s tests -p 'test_q1e*.py' -q
          python3 -m py_compile scripts/capture_task8_native_counterexamples.py
      - name: Checkout source-pinned original tau2
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/sierra-research/tau2-bench.git vendor/tau2-bench
          git -C vendor/tau2-bench checkout --quiet --detach c06b07dd7c4d4ec61ba6ff9bcdf0b15dd7ef36d4
          test "$(git -C vendor/tau2-bench rev-parse HEAD)" = 'c06b07dd7c4d4ec61ba6ff9bcdf0b15dd7ef36d4'
          test -z "$(git -C vendor/tau2-bench status --porcelain --untracked-files=no)"
      - name: Install source-pinned runtime unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv .venv-tools
          .venv-tools/bin/python -m pip install 'uv==0.13.9'
          (cd vendor/tau2-bench && ../../.venv-tools/bin/uv sync --frozen --no-dev --python "$(command -v python3.12)")
      - name: Execute exactly 10 frozen native tool-sequence cases (no model calls)
        shell: bash
        run: |
          set -euo pipefail
          vendor/tau2-bench/.venv/bin/python scripts/capture_task8_native_counterexamples.py \
            --checkout vendor/tau2-bench \
            --run-binding "Q1E_COUNTEREXAMPLE_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
            --out-dir results/q1e_counterexamples_native
      - name: Independently re-evaluate captured Native case bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_native_case_bundle.py --out-dir results/q1e_counterexamples_native
      - name: Upload case-level raw evidence even on failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: etb-q1e-native-counters-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/q1e_counterexamples_native/
          if-no-files-found: warn
          retention-days: 30
